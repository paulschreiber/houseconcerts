name: Auto approve

on:
  pull_request:

jobs:
  auto-approve:
    name: Auto approve
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Approve Dependabot pull request
        uses: hmarr/auto-approve-action@05a696a09d381a5a0d142c755f7eacbb19eb6525
