# The production environment, which holds the SSH key, only accepts
# deploys from main.
name: Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency: deploy-production

jobs:
  deploy:
    name: Deploy to production
    if: github.triggering_actor == github.repository_owner
    runs-on: ubuntu-latest
    environment: production
    env:
      BUNDLE_ONLY: deploy
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          bundler-cache: true

      - name: Install SSH key
        uses: shimataro/ssh-key-action@87a8f067114a8ce263df83e9ed5c849953548bc3 # v2.8.1
        with:
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          name: id_ed25519
          known_hosts: ${{ vars.DEPLOY_KNOWN_HOSTS }}

      - name: Deploy
        run: bundle exec cap production deploy
