name: Linters

on:
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  changes:
    uses: ./.github/workflows/detect-changes.yml

  ruby:
    name: RuboCop
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    env:
      BUNDLE_WITHOUT: "default doc job cable storage test db"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1.321.0
        with:
          bundler-cache: true

      - name: Run RuboCop
        run: bundle exec rubocop --parallel

  javascript:
    name: JavaScript
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 26
          cache: npm

      - name: Install packages
        run: npm ci

      - name: Run ESLint
        run: npm run lint:js

      - name: Run Prettier
        run: npm run format:check

  scss:
    name: SCSS
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 26
          cache: npm

      - name: Install packages
        run: npm ci

      - name: Run Stylelint
        run: npm run lint:css
