# `pre-commit install` installs both hook types, so conventional-pre-commit
# (a commit-msg hook) checks commit messages without a separate -t commit-msg.
default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
        name: Enforce end of file format

      - id: trailing-whitespace
        name: Enforce removal of trailing whitespace

      - id: mixed-line-ending
        args: [--fix=lf]

      - id: fix-byte-order-marker

      - id: check-json
      - id: check-yaml
        # Rails fixtures use ERB inside YAML for dynamic values (e.g. dates),
        # which isn't valid plain YAML.
        exclude: ^test/fixtures/

  # Run the rubocop and plugin versions from Gemfile.lock (kept current by
  # Dependabot) instead of a separate copy that would drift from them.
  - repo: local
    hooks:
      - id: rubocop
        name: rubocop
        entry: bundle exec rubocop --force-exclusion
        language: system
        types: [ruby]

  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v10.11.0
    hooks:
      - id: eslint
        files: \.js$
        additional_dependencies:
          - eslint
          - "@eslint/js"
          - eslint-config-prettier
          - eslint-plugin-import-x
          - globals

  - repo: https://github.com/JoC0de/pre-commit-prettier
    rev: v3.9.8
    hooks:
      - id: prettier
        files: \.js$
        additional_dependencies:
          - prettier

  - repo: https://github.com/thibaudcolas/pre-commit-stylelint
    rev: v17.15.0
    hooks:
      - id: stylelint
        files: \.scss$
        additional_dependencies:
          - stylelint
          - stylelint-config-standard-scss

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
