# `pre-commit install` installs both hook types, so conventional-pre-commit
# (a commit-msg hook) checks commit messages without a separate -t commit-msg.
default_install_hook_types: [pre-commit, commit-msg]
# Hooks without their own stages run only at pre-commit, not again at commit-msg.
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: end-of-file-fixer
        name: Enforce end of file format

      - id: trailing-whitespace
        name: Enforce removal of trailing whitespace

      - id: mixed-line-ending
        args: [--fix=lf]

      - id: fix-byte-order-marker

      - id: check-json
      - id: check-yaml
        # Rails fixtures use ERB inside YAML for dynamic values (e.g. dates),
        # which isn't valid plain YAML.
        exclude: ^test/fixtures/

  # Run the linters from the project's own dependencies, at the versions in
  # Gemfile.lock and package-lock.json (kept current by Dependabot), instead
  # of separate, unpinned copies that would drift from them. Needs
  # `bundle install` and `npm install`.
  - repo: local
    hooks:
      - id: rubocop
        name: rubocop
        entry: bundle exec rubocop --force-exclusion
        language: system
        types: [ruby]

      - id: eslint
        name: eslint
        entry: npx --no-install eslint
        language: system
        files: \.js$

      - id: prettier
        name: prettier
        entry: npx --no-install prettier --write --ignore-unknown
        language: system
        files: \.js$

      - id: stylelint
        name: stylelint
        entry: npx --no-install stylelint
        language: system
        files: \.scss$

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: 91ab4bf57e58b32adf1a122681f6ebe164d081c8 # frozen: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
