default: &default
  adapter: sqlite3
  pool: 5
  timeout: 5000

development: &development
  adapter: mysql2
  encoding: utf8mb4
  database: houseconcerts_dev
  username: root
  host: <%= ENV.fetch("DB_HOST", "localhost") %>
  # Solid Queue's worker needs its threads (config/queue.yml) + 2.
  pool: 12

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *development
  database: houseconcerts_test

production:
  <<: *development
