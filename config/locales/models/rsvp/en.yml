en:
  activerecord:
    errors:
      models:
        rsvp:
          # These messages are full sentences, shown on their own under each
          # field, so full_messages (e.g. in Madmin) uses them as written rather
          # than putting the attribute name in front. Needs
          # config.active_model.i18n_customize_full_message.
          format: "%{message}"
          attributes:
            first_name:
              blank: "Enter your first name"
              too_short: "Enter your first name"
              all_lowercase: "Your first name cannot be in all lowercase"
              all_caps: "Your first name cannot be in all caps"
            last_name:
              blank: "Enter your last name"
              too_short: "Enter your last name"
              all_lowercase: "Your last name cannot be in all lowercase"
              all_caps: "Your last name cannot be in all caps"
            email:
              invalid: "Enter your email address"
            :phone_number:
              invalid: "Enter your phone number"
            postcode:
              invalid: "Enter your zip code"
            seats_reserved:
              not_a_number: "Select the number of seats you want"
              greater_than_or_equal_to: "Select the number of seats you want"
              less_than_or_equal_to: "Select the number of seats you want"
            response:
              inclusion: "Select whether or not you’re coming"
            show_id:
              inclusion: "Select a show"
