en:
  activerecord:
    errors:
      models:
        show:
          # Full sentences, so full_messages (e.g. in Madmin) uses them as
          # written rather than putting the attribute name in front. Each of
          # Show’s validations needs a message here, since a default one
          # (“must be after …”) doesn’t say which field it’s about.
          format: "%{message}"
          attributes:
            name:
              blank: "Enter a show name"
            status:
              inclusion: "Enter a valid show status"
            price:
              blank: "Enter a price for the show"
              not_a_number: "Enter a price for the show"
              not_an_integer: "Enter the price in whole dollars"
              greater_than_or_equal_to: "The price must be at least $%{count}"
              less_than_or_equal_to: "The price cannot be more than $%{count}"
            venue:
              required: "Select a venue"
            end:
              invalid_datetime: "Enter a valid end date/time"
              after: "The end must be after the start"
            start:
              invalid_datetime: "Enter a valid start date/time"
