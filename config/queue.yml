default: &default
  dispatchers:
    - polling_interval: 1
      batch_size: 500
  workers:
    - queues: "*"
      # Batch sends spend most of their time waiting on SES's SMTP server.
      # Needs a database pool of threads + 2 (config/database.yml).
      threads: 10
      processes: <%= ENV.fetch("JOB_CONCURRENCY", 1) %>
      # Polling commits database transactions even when the queue is empty, and
      # frequent commits keep the server’s disks busy.
      polling_interval: 1

development:
  <<: *default

test:
  <<: *default

production:
  <<: *default
