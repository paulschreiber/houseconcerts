  about: |-
    Chris Pierce first blew me away with his SXSW performance in 2008, and he’s only gotten better.

    A fantastic songwriter with tremendous range and a soulful voice, Chris has a stage presence that doesn’t so much command attention but instead draws you in and keeps you rapt.

    Chris has sung with Neil Young, B.B. King, Steve Earle, Aaron Neville and and Blind Boys of Alabama and had his praises sung by *Rolling Stone* and *American Songwriter*.
