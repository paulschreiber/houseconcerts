  subject: update invite for Dan+Laurel
  intro: |-
    I just got back from Canada, where the Montréal Canadiens won nine games in a row to start the season, and Stephen Harper is no longer Prime Minster. Not a bad trip!

    For this month’s show, we go international with (Canadian) Dan Frechette and (American) Laurel Thomsen.
  about: |-
    Dan is a songwriter, guitarist, and harmonica player from Winnipeg. Over the past 25 years, he’s been across North America and Europe, signed to EMI, and excited the CBC (that’s Canadian for PBS).

    Laurel is a classically-trained violinist, composer and teacher from Santa Cruz (Go Banana Slugs!). When “Hookmeister” Thomsen isn’t hosting the Violin Geek podcast, she’s on the road with Dan, creating great music.

    [Say yes to Sunday afternoon with Dan and Laurel][rsvp].

    P.P.S. Winnie The Pooh was named after Winnipeg.
