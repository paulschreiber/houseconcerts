  date: "2016-09-14T08:34:46-04:00"
  subject: update invite for kid beyond
  intro: |-
    Happy September! There are just 54 days left until the election. Even better: there are only 24 days until my next house concert.

    Kid Beyond is coming to Brooklyn!
  about: |-
    After sixty-three shows, it’s time for a first: my first beatboxer. Yes, you read that right. No guitar. No piano. No instruments, period. Just Kid Beyond and his amazing voice.

    Kid Beyond’s beautiful live-looping and beatboxing has kept listeners rapt (and moving) at Coachella, SXSW and even Burning Man. Now, you get to see him up close and personal: in my living room.

    Don’t wait. Grab your seat now before his fans snag them all. [RSVP for Kid Beyond][rsvp_yes].
