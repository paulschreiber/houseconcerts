  date: "2018-04-01T18:54:45-04:00"
  subject: update invite for Patrice Pike
  intro: |-
    Happy spring! I’m excited to announce a great lineup of house concerts for 2018: Edie Carey, Jen Lowe and Carlos Olmeda are confirmed so far, with more to be announced soon.

    We’re starting off the year with the amazing Patrice Pike.
  about: |-
    Patrice Pike has been rocking for over two decades, as the frontwoman for Sister 7, as a solo performer and alongside Wayne Sutton. She's picked up half a dozen Austin Music Awards, and was the youngest person inducted into the Austin Music Hall of fame.

    Patrice’s eclectic mix of rock and soul has earned raves from *Rolling Stone* and *Billboard*. She’s released six solo albums and won Grand Prize Overall and First Prize Rock in the USA Songwriting competition.

    We’re thrilled to have her.

    [Reserve your seats for {{show.name}}][rsvp_yes].
