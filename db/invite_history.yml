  subject: update invite for Shawna Caspi
  intro: May is wrapping up. It’s almost time for the Stanley Cup, the NBA Finals…and the next house concert.
  about: |-
    I’m always excited when I get to host a Canadian musician. Even when it isn’t Canada’s sesquicentennial. But especially when it is.

    Shawna Caspi hails from my old home, Toronto. She’s kicking off her northeastern US tour in my new home, Brookyln.

    A singer-songwriter and fingerstyle guitarist whose fourth full-length album is weeks away from dropping, Shawna has toured across the US and Canada. From Bowling Green to Asheville, Kamploops to Columbus, she’s racking up rave reviews and winning listeners over with songs that are alternatingly haunting and atmospheric and airy and hopeful.

    [RSVP now for {{show.name}}][rsvp_yes].
