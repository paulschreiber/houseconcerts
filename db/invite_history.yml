- commit: 256d0cbb0b44155fd567fe32196411d0e9a5d22f
  date: "2016-01-19T21:14:50-05:00"
  subject: update invite for jen lowe
  intro: |-
    Happy 2016! I spent New Year’s in Boston, where I watched the Montréal Canadiens shellac the Boston Bruins in this year’s Winter Classic — that’s right, outdoor hockey. Like when you were a kid!

    Now that I’m back home in Brooklyn, I’m happy to introduce you to Connecticut’s Jen Lowe.
  about: |-
    My friend Natalie and I met Jen Lowe in a Saratoga parking lot after a Jason Mraz concert. It’s a funny story involving a couple of arts-and-crafts projects pranks.

    When Jen’s not golfing up a storm or touring with California rockers Jason Mraz and Tristan Prettyman, this New England-based singer-songwriter puts down a cajon or picks up a guitar and writes some fine songs. Whether about the depths of a broken heart or weathering the stormy seas, Jen's voice and gentle caress of her guitar draw you in.

    [Say yes to Sunday afternoon with Jen Lowe][rsvp_yes].
