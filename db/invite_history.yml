  intro: "I’m writing from the newest location of Paul’s Brooklyn House Concerts. The lights are up, the stereo is in, the chairs are stacked ... the rest still needs some cleaning up. But have no fear: we’ll be all set in two weeks for Jesse Terry."
  about: |-
    I found out about Jesse my favourite way: while at another concert. Rebecca Loebe asked me to come check out her set. I did — she was great. She performed in the round with two others. One was Jesse.

    In addition to the the Rockwood Music Hall and the usuals — Passim in Cambridge, Eddie’s Attic in Decatur — Jesse Terry has played the big stages, too: he’s been to the Philadelphia Folk Festival (four times) and Bonnaroo. Through his four albums, Jesse’s gritty, warm words and music offer hope for a kinder tomorrow.

    [RSVP now for Jesse Terry][rsvp_yes].
