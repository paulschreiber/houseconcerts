  date: "2026-10-03T15:56:54-04:00"
  subject: "fix: update invite for damon castillo"
  intro: |-
    Happy October! This week, the Liberty beat the top-seeded Lynx, the PWHL announced its 2026–27 schedule and lots of folks learned about the difference between a Hawk and a Hawkeye.

    Next up: Damon Castillo! Damon last played my series in 2008, back when it was in San Francisco. I’m thrilled to have him back, and to introduce him to Brooklyn.
  about: |-
    Damon Castillo is a songwriter, producer and mixer whose eclectic, jazz-informed rock, funk and soul paint a sun-bleached portrait of life and love in the Golden State.

    Born in Santa Maria, California, Damon headed east after high school to study jazz at — where else — Berklee. He then returned west and settled in San Luis Obispo, where he leads the Damon Castillo Band. He also runs a studio, producing and mixing records for other artists. His music has turned up in campaigns for Target, Starbucks, Miller Lite and MTV, so there’s a chance you’ve heard Damon without knowing it.

    Damon’s albums, including *Mess of Me*, *Laurel Lane*, *Live at the Mission* and *Revolving Door*, feature Grammy winners Ross Hogarth and F. Reid Shippen. He has a publishing deal with Warner Chappell and has shared the stage with Chicago, John Scofield, The Temptations, Train and Chris Isaak.

    Get ready for the show with his recent singles “Say It Now,” “Blue Sky” and “My Kind of Jam.”
