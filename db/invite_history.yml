  intro: "Happy October! Now that Canadian Thanksgiving is over, it’s time to get ready for the next big event of the month: the Megan Slankard/Alex Wong house concert."
  about: |-
    I’ve been a fan of Megan Slankard’s for almost a decade and a half. Ever since I’ve been in New York, we’ve been trying to put a show together. Good news: it worked.

    The one-time star of *What Not To Wear* has five albums under her (fashionable) belt and impressed judges at the UK Songwriting Contest, International Songwriting Contest and Show Me the Music Contest. (She was a finalist in all four.)

