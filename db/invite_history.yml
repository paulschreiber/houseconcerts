  intro: |-
    I just came back from a terrific long weekend in San Francisco. I celebrated the marriage of two amazing women, ate delicious food, soaked in some California sunshine, and caught up with old friends. There’s another trip coming up soon, but I’m getting ahead of myself...

    Jay Nash is coming to Brooklyn!
  about: |-
    I’m super excited to be hosting Jay Nash again. Half of The Contenders *and* a captivating solo performer.

