  intro: Happy September! I hope you’ve had a great summer. I’m off to Hudson West fest today. Before I leave, I wanted to make sure you heard about the Cynthia Catania show in two weeks! Cynthia is an old friend of the series, and this is her second time playing here in Brooklyn.
  about: |-
    Cynthia Catania grew up in the New York City music scene. Romanced by California and all things west coast, she moved to Los Angeles on the heels of the Northridge earthquake.

    After forming Saucy Monky with Annmarie Cullen, they performed for festival audiences across Europe — opening for Wilco, The B52s, Black Eyed Peas, The Cure, Pink and PJ Harvey.

    Putting on her composer hat, Cynthia's work on the short film *Once More, Like Rainman,* won Best Comedy Short at the LA Shorts International Film Festival. She was awarded Best Composer at the Bridge Fest Film Festival in Vancouver, BC.

    In November of 2023, Cynthia began collaborating with Rich Devletian. The duo, known for their hypnotic performances, is recording their debut EP in Los Angeles.
