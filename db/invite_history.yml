  subject: update invite for Anne Heaton
  intro: |-
    It’s almost July! Canada and the United States will both turn another year older. Professional sports will take a day off. The NYC subway will break down. Hey, at least it’s not on fire…yet.

    Good news: singer-songwriter — and friend-of-Paul’s house concerts — Anne Heaton is coming.
  about: |-
    A long-time Chicagoan and Bostonian who now calls Michigan home, Anne Heaton has earned raves from Boston to Biloxi, not to mention kind words from *Paste* and *Performing Songwriter*.

    Anne has six solo albums under her belt, and one more as one quarter of Winterbloom. This folk-pop singer-songwriter has performed at Lilith Fair and Sundance and is a regular at Boston’s Club Passim.

    I’m excited to have her back. Don’t miss out.

    [Reserve your seats for {{show.name}}][rsvp_yes].
